version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: hrms_mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - hrms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=hrms_lite
    depends_on:
      - mongodb
    command: >
      bash -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - hrms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - hrms_network

volumes:
  mongodb_data:

networks:
  hrms_network:
    driver: bridge
