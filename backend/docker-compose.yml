services:
  api:
    build: .
    container_name: hrms_backend_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=${DATABASE_NAME:-hrms_lite}
      - API_TOKEN=${API_TOKEN:-admin123-token}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PORT=${PORT:-8000}
    networks:
      - hrms_backend_network

networks:
  hrms_backend_network:
    driver: bridge
